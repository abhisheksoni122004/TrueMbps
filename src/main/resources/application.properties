# =========================================================
# Tomcat tuning for a bandwidth-heavy, high-concurrency app
# =========================================================
# The default thread pool (200) is sized for typical request/response
# apps. This speed test opens several long-lived streaming connections
# per visitor (up to 4 download + 4 upload streams at once), so it needs
# more headroom to avoid rejecting testers under normal concurrent load.

# Max worker threads Tomcat can use to handle requests at once.
server.tomcat.threads.max=400

# Threads kept alive and ready even when idle, so new testers don't
# wait for a thread to spin up.
server.tomcat.threads.min-spare=20

# How many incoming connections can queue up if all threads are busy,
# before new connections start getting refused outright.
server.tomcat.accept-count=100

# Max simultaneous open connections (streaming + regular) the server
# will accept at all.
server.tomcat.max-connections=1000

# How long (ms) a connection can sit idle before Tomcat closes it.
# Keep this above your MAX_STREAM_DURATION_MS in the controller (15s)
# so it doesn't cut a legitimate stream off early.
server.tomcat.connection-timeout=20000

# =========================================================
# Optional: basic health/monitoring endpoint
# =========================================================
# Requires the "spring-boot-starter-actuator" dependency in your
# pom.xml/build.gradle. Once added, GET /actuator/health will report
# whether the service is up — useful for Render's health checks and
# for your own uptime monitoring.
# management.endpoints.web.exposure.include=health